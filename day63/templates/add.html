<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Book</title>
    <style>
      body {
        background-color: #f8f9fa;
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        color: #343a40;
      }
      form {
        display: flex;
        flex-direction: column;
        max-width: 300px;
      }
      label {
        margin-bottom: 5px;
      }
      input {
        margin-bottom: 10px;
        padding: 5px;
        border: 1px solid #dee2e6;
        border-radius: 4px;
      }
      button {
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <form action="/add" method="POST">
      <label style="margin: 5px; display: flex; flex-direction: column"
        >Book Name</label
      >
      <input type="text" name="Bookname" /> <br />
      <label style="margin: 5px; display: flex; flex-direction: column"
        >Book Author</label
      >
      <input type="text" name="BookAuthor" /> <br />
      <label style="margin: 5px; display: flex; flex-direction: column"
        >Rating</label
      >
      <input type="text" name="Rating" /> <br />
      <button
        type="submit"
        style="margin: 5px; display: flex; flex-direction: column"
      >
        Add Book
      </button>
    </form>
  </body>
</html>
