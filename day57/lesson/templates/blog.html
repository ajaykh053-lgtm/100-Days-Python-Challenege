<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>
</head>
<body>
    <section>
        {% for blog_post in blogs %}
            {%if blog_post['id'] == 2%}
                <h1>{{blog_post["title"]}}</h1>
                <h2>{{blog_post["subtitle"]}}</h2>
            {% endif %}
        {%endfor%}
    </section>
</body>
</html>
