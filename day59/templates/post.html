{% include 'header.html' %}
{% for posts in blog_post %}
{% if posts['id'] == post_id %}
<!-- Page Header-->
<header
  class="masthead"
  style="background-image: url(&quot;../static/assets/img/home-bg(1).jpg&quot;)"
>
  <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="post-heading">
          {{posts['title']}}
          <h2 class="subheading">{{posts['subtitle']}}</h2>
          <span class="meta">
            Posted by
            <a href="#!">{{posts['author']}}</a>
            {{posts['date']}}
          </span>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- Post Content-->
<article class="mb-4">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <p>
          {{posts['body']}}
        </p>
      </div>
    </div>
  </div>
</article>

{% endif %}
{% endfor %}
{% include 'footer.html' %}
